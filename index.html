<!DOCTYPE html>
<html lang="en-IN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<title>SB TUBE</title>
<style>
:root{--bg:#070b18;--card:#101733;--line:#1f2a52;--tx:#f4f6ff;--mu:#8e99c4;--sf:#ff8a1f;--gr:#19c25a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:78px}
header{position:sticky;top:0;z-index:5;background:rgba(7,11,24,.92);backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:40px;height:40px;border-radius:50%}
.brand b{font-size:22px;letter-spacing:.5px;background:linear-gradient(90deg,var(--sf) 0 38%,#fff 38% 62%,var(--gr) 62%);-webkit-background-clip:text;background-clip:text;color:transparent}
.search{display:flex;gap:8px;margin-top:10px}
.search input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:11px 16px;color:var(--tx);font-size:15px;outline:none}
.search input:focus{border-color:var(--sf)}
.btn{background:var(--sf);color:#1a1000;border:0;border-radius:24px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.hero{padding:26px 16px 8px}
.hero h1{font-size:30px;line-height:1.15;min-height:70px;font-weight:800}
.cur{display:inline-block;width:3px;height:.9em;background:var(--gr);margin-left:3px;vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.chip{flex:none;padding:8px 15px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--tx);font-size:13px;cursor:pointer}
h2{font-size:17px;padding:14px 16px 6px}
.grid{display:grid;gap:18px;padding:8px 14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.v{cursor:pointer}
.th{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--card)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.du{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);font-size:12px;padding:2px 6px;border-radius:6px}
.meta{display:flex;gap:10px;margin-top:8px;align-items:flex-start}
.meta div{flex:1;min-width:0}
.t{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c{color:var(--mu);font-size:12.5px;margin-top:2px}
.dots{background:none;border:0;color:var(--mu);font-size:22px;padding:0 6px;cursor:pointer}
.sk{aspect-ratio:16/9;border-radius:14px;background:linear-gradient(90deg,var(--card),#18214a,var(--card));background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.chs{display:flex;gap:14px;overflow-x:auto;padding:6px 16px;scrollbar-width:none}
.cc{flex:none;width:84px;text-align:center;font-size:12px;cursor:pointer}
.cc img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--line);display:block;margin:0 auto 6px;background:var(--card)}
.cc span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chh{display:flex;gap:14px;align-items:center;padding:16px}
.chh img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--card)}
.chh b{font-size:19px;display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(11,16,36,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:11px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button span{font-size:21px}
nav button.on{color:var(--sf)}
.pg{display:none}.pg.on{display:block}
.msg{padding:30px 20px;text-align:center;color:var(--mu)}
.help a{display:flex;align-items:center;gap:12px;margin:12px 16px;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--tx);text-decoration:none;font-weight:600}
.help a span{font-size:26px}
.help small{display:block;color:var(--mu);font-weight:400}
/* player */
.modal{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:hidden;transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.9,.2,1),top .45s cubic-bezier(.2,.9,.2,1),bottom .45s cubic-bezier(.2,.9,.2,1),left .45s,right .45s,border-radius .45s}
.modal.on{transform:none}
.amb{position:absolute;inset:-60px;background:center/cover;filter:blur(55px) saturate(1.7);opacity:.5;transform:scale(1.2)}
.mbody{position:relative;z-index:1;height:100%;overflow-y:auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
.top b{font-size:13px;color:var(--mu);font-weight:600}
.ib{background:rgba(255,255,255,.1);border:0;color:var(--tx);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;transition:transform .15s,background .2s}
.ib:active{transform:scale(.85);background:rgba(255,255,255,.22)}
.eq{display:flex;gap:3px;align-items:flex-end;height:18px;width:30px}
.eq i{flex:1;border-radius:2px;background:linear-gradient(var(--sf),var(--gr));height:100%;transform-origin:bottom;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.paused .eq i{animation-play-state:paused}
.stage{position:relative;margin:0 12px;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:16/9;box-shadow:0 18px 50px rgba(255,138,31,.28),0 0 0 1px rgba(255,255,255,.08)}
.pl{position:absolute;inset:0}
.pl iframe,#ytp{width:100%;height:100%;border:0;display:block}
.art{display:none;position:absolute;inset:0;background:center/cover}
.art::after{content:"🎧 Audio only";position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.65);padding:4px 10px;border-radius:12px;font-size:12px}
.ao .art{display:block}
.ao .pl{inset:auto;left:-9999px;top:0;width:320px;height:180px}
.fsb,.fsx{display:none}
.stage.fs{position:fixed;inset:0;margin:0;border-radius:0;aspect-ratio:auto;z-index:60;width:100%;height:100%}
.fs .fsb{display:flex;position:absolute;left:0;right:0;bottom:0;padding:26px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.8));gap:10px;align-items:center;z-index:2}
.fs .fsx{display:flex;position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:3;background:rgba(0,0,0,.5)}
.info{padding:16px 16px 6px}
.info h3{font-size:20px;line-height:1.25}
.info .c.ch{color:var(--sf);cursor:pointer;display:inline-block}
.sw{animation:sw .55s cubic-bezier(.2,.9,.2,1)}
@keyframes sw{from{opacity:0;transform:translateY(14px)}}
.seek{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;color:var(--mu)}
.seek input,.fsb input{flex:1;accent-color:var(--sf);height:22px}
.fsb span{font-size:12px;color:#fff}
.ctl{display:flex;justify-content:center;align-items:center;gap:22px;margin:12px 0 6px}
.ctl .ib{width:50px;height:50px;font-size:20px}
.ctl .pp,.fsb .pp{background:linear-gradient(135deg,var(--sf),#ffb35c);color:#1a1000}
.ctl .pp{width:72px;height:72px;font-size:28px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 8px 26px rgba(255,138,31,.4)}50%{box-shadow:0 8px 44px rgba(255,138,31,.85)}}
.paused .pp{animation:none}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.mctl{display:none}
.modal.min{top:calc(100% - 134px);bottom:64px;left:8px;right:8px;border-radius:16px;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.min .mbody{overflow:hidden}
.min .top,.min .seek,.min .ctl,.min .tools,.min h2,.min #rel,.min .info .c{display:none}
.min .stage{position:absolute;left:0;top:0;bottom:0;width:112px;margin:0;border-radius:0;aspect-ratio:auto;box-shadow:none}
.min .info{margin-left:112px;padding:14px 96px 10px 12px;cursor:pointer}
.min .info h3{font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.min .mctl{display:flex;position:absolute;right:6px;top:50%;transform:translateY(-50%)}
.min .mctl .ib{background:none;width:42px;height:42px}
body.hasmini{padding-bottom:170px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet>div{background:var(--card);width:100%;max-height:70%;overflow:auto;border-radius:20px 20px 0 0;padding:16px;animation:up .25s}
@keyframes up{from{transform:translateY(100%)}}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.sheet input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px;color:var(--tx);margin:10px 0}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:20px;font-weight:600;z-index:90;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

<script>
// ===== CONFIG =====
const API_KEY="AIzaSyDGRie20WgvmRn9yZ_YW25Md73uQ2WgD6c"; // YouTube Data API v3
const REGION="IN";
const MIN_SEC=90; // videos shorter than this (Shorts) are hidden
// ==================
const $=s=>document.querySelector(s);
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let saved=ls.get("sb_saved",[]),pls=ls.get("sb_pls",{}),ao=ls.get("sb_ao",false),cur=null,tok="",lastQ="",chTok="",chId="";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast=m=>{const t=$("#ts");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2200)};
const A=()=>window.Android;

// typing animation
const lines=["Listen to songs.","Watch what's trending.","Build your playlists.","Only on SB TUBE."];
(async()=>{const el=$("#ty");let i=0;while(1){const w=lines[i++%lines.length];for(let k=1;k<=w.length;k++){el.textContent=w.slice(0,k);await new Promise(r=>setTimeout(r,70))}await new Promise(r=>setTimeout(r,1400));for(let k=w.length;k>=0;k--){el.textContent=w.slice(0,k);await new Promise(r=>setTimeout(r,35))}await new Promise(r=>setTimeout(r,250))}})();

// api helpers
async function api(p,o){const u=new URL("https://www.googleapis.com/youtube/v3/"+p);Object.entries({...o,key:API_KEY}).forEach(([k,v])=>u.searchParams.set(k,v));
 const r=await fetch(u);const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||"Network error");return j}
const dur=iso=>{const m=/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(iso||"");return m?(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0):0};
const fmt=s=>{s=Math.max(0,s|0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const thumb=t=>(t.medium||t.high||t.default).url;
const normV=(i,id)=>({id,t:i.snippet.title,c:i.snippet.channelTitle,cid:i.snippet.channelId,im:thumb(i.snippet.thumbnails)});
const keep=v=>v.d>=MIN_SEC&&!/#shorts?\b/i.test(v.t);
async function enrich(list){if(!list.length)return[];const j=await api("videos",{part:"contentDetails",id:list.map(v=>v.id).join(","),maxResults:50});const m={};j.items.forEach(x=>m[x.id]=dur(x.contentDetails.duration));return list.filter(v=>{v.d=m[v.id]||0;return keep(v)})}

const reg={},regC={};
const card=v=>`<div class="v" data-id="${v.id}"><div class="th"><img loading="lazy" src="${v.im}" alt="">${v.d?`<span class="du">${fmt(v.d)}</span>`:""}</div><div class="meta"><div><div class="t">${esc(v.t)}</div><div class="c">${esc(v.c)}</div></div><button class="dots" data-m="${v.id}" aria-label="More options">⋮</button></div></div>`;
const chCard=c=>`<div class="cc" data-ch="${c.id}"><img src="${c.im}" alt=""><span>${esc(c.t)}</span></div>`;
function draw(el,list){list.forEach(v=>reg[v.id]=v);el.insertAdjacentHTML("beforeend",list.map(card).join(""))}
function put(el,list){el.innerHTML="";draw(el,list)}
const skel=el=>el.innerHTML='<div class="sk"></div>'.repeat(4);
const err=(el,e)=>el.innerHTML=`<div class="msg">Could not load: ${esc(e.message)}<br><br><button class="btn g" onclick="location.reload()">Try again</button></div>`;

// pages
function go(p){document.querySelectorAll(".pg").forEach(x=>x.classList.toggle("on",x.id===p));document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));scrollTo(0,0);if(p==="lib")lib()}
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.p)};

// home
["Bengali songs","Hindi hits","Arijit Singh","Rabindra Sangeet","Romantic songs","Lofi","Old is gold","Devotional"].forEach(c=>$("#chips").insertAdjacentHTML("beforeend",`<button class="chip">${c}</button>`));
$("#chips").onclick=e=>{if(e.target.classList.contains("chip"))search(e.target.textContent)};
(async()=>{skel($("#trend"));try{const j=await api("videos",{part:"snippet,contentDetails",chart:"mostPopular",regionCode:REGION,videoCategoryId:10,maxResults:40});
 put($("#trend"),j.items.map(i=>{const v=normV(i,i.id);v.d=dur(i.contentDetails.duration);return v}).filter(keep))}
 catch(e){try{const j=await api("search",{part:"snippet",type:"video",q:"trending songs",regionCode:REGION,maxResults:25});put($("#trend"),await enrich(j.items.map(i=>normV(i,i.id.videoId))))}catch(e2){err($("#trend"),e2)}}})();

// search (videos + channels)
async function search(q,more){if(!q.trim())return;lastQ=q;$("#q").value=q;
 if(!more){go("res");$("#rt").textContent='Results for "'+q+'"';skel($("#rg"));$("#rch").innerHTML="";tok=""}
 try{const j=await api("search",{part:"snippet",type:"video,channel",q,maxResults:20,regionCode:REGION,safeSearch:"moderate",...(more&&tok?{pageToken:tok}:{})});tok=j.nextPageToken||"";
  const chs=[],vs=[];j.items.forEach(i=>{if(i.id.kind==="youtube#channel"){const c={id:i.id.channelId,t:i.snippet.title,im:thumb(i.snippet.thumbnails)};regC[c.id]=c;chs.push(c)}else if(i.id.videoId)vs.push(normV(i,i.id.videoId))});
  const l=await enrich(vs);if(!more)$("#rg").innerHTML="";
  $("#rch").insertAdjacentHTML("beforeend",chs.map(chCard).join(""));
  if(!l.length&&!more&&!chs.length)$("#rg").innerHTML='<div class="msg">No results found. Try a different name.</div>';
  draw($("#rg"),l);$("#more").style.display=tok?"block":"none"}catch(e){err($("#rg"),e)}}
$("#sf").onsubmit=e=>{e.preventDefault();$("#q").blur();search($("#q").value)};
$("#mb").onclick=()=>search(lastQ,1);

// channel page
async function openCh(id,more){const c=regC[id]||{id,t:"Channel",im:""};
 if(!more){chId=id;go("chn");$("#chh").innerHTML=`<img src="${c.im}" alt=""><div><b>${esc(c.t)}</b><span class="c">Latest videos</span></div>`;skel($("#cg"));chTok=""}
 try{const j=await api("search",{part:"snippet",channelId:id,type:"video",order:"date",maxResults:25,...(more&&chTok?{pageToken:chTok}:{})});chTok=j.nextPageToken||"";
  const l=await enrich(j.items.filter(i=>i.id.videoId).map(i=>normV(i,i.id.videoId)));if(!more)$("#cg").innerHTML="";
  if(!l.length&&!more)$("#cg").innerHTML='<div class="msg">No videos found on this channel.</div>';
  draw($("#cg"),l);$("#cmore").style.display=chTok?"block":"none"}catch(e){err($("#cg"),e)}}
$("#cmb").onclick=()=>openCh(chId,1);

// clicks
document.addEventListener("click",e=>{
 const m=e.target.closest("[data-m]");if(m){e.stopPropagation();return sheet(reg[m.dataset.m])}
 const c=e.target.closest("[data-ch]");if(c)return openCh(c.dataset.ch);
 const v=e.target.closest(".v");if(v&&reg[v.dataset.id]){const q=[...v.parentNode.querySelectorAll(".v")].map(x=>reg[x.dataset.id]).filter(Boolean);const i=q.findIndex(x=>x.id===v.dataset.id);play(q[i],q.slice(i+1))}});

// ===== player =====
let yt=null,ytReady=false,pend=null,hist=[],nl=[],want=true,drag=false,tick=null,tries=0;
(()=>{const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";document.head.appendChild(s)})();
const md=$("#md"),stg=$("#stg"),sw=el=>{el.classList.remove("sw");void el.offsetWidth;el.classList.add("sw")};
function setP(on){md.classList.toggle("paused",!on);$("#pp").textContent=$("#mPP").textContent=$("#fsPP").textContent=on?"⏸":"▶"}
function mk(id){
 if(yt){if(ytReady)yt.loadVideoById(id);else pend=id;return}
 if(window.YT&&YT.Player){tries=0;setP(true);yt=new YT.Player("ytp",{videoId:id,width:"100%",height:"100%",
  playerVars:{autoplay:1,controls:0,disablekb:1,fs:0,playsinline:1,rel:0,modestbranding:1,iv_load_policy:3,origin:location.origin},
  events:{onReady:()=>{ytReady=true;if(pend){yt.loadVideoById(pend);pend=null}if(!tick)tick=setInterval(prog,500)},
   onStateChange:e=>{const s=e.data;if(s===1||s===3)setP(true);else if(s===2){setP(false);if(want&&(document.hidden||!document.hasFocus()))setTimeout(()=>{try{yt.playVideo()}catch(x){}},400)}else if(s===0)nxt()},
   onError:()=>{toast("This video can't be played. Skipping to the next one.");nxt()}}})}
 else if(tries++<12)setTimeout(()=>mk(id),600);else toast("Player could not load. Check your internet.")}
function prog(){if(!ytReady||!yt.getCurrentTime)return;const t=yt.getCurrentTime()||0,d=yt.getDuration()||0;$("#tc").textContent=fmt(t);$("#td").textContent=fmt(d);if(!drag&&d){const p=Math.round(t/d*1000);$("#sk").value=p;$("#fsSeek").value=p}}
["#sk","#fsSeek"].forEach(s=>{const el=$(s);el.oninput=()=>{drag=true;const d=(yt&&yt.getDuration&&yt.getDuration())||0;$("#tc").textContent=fmt(el.value/1000*d)};el.onchange=()=>{const d=(yt&&yt.getDuration&&yt.getDuration())||0;if(d)yt.seekTo(el.value/1000*d,true);drag=false}});
function setAo(){stg.classList.toggle("ao",ao);$("#tAo").textContent="🎧 Audio only: "+(ao?"On":"Off")}
function play(v,q,back){if(!v)return;if(cur&&!back&&cur.id!==v.id)hist.push(cur);cur=v;if(q)nl=q.filter(x=>x.id!==v.id);want=true;
 md.classList.add("on");md.classList.remove("min");document.body.classList.remove("hasmini");document.body.style.overflow="hidden";
 const hq=`https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`;$("#amb").style.backgroundImage=`url(${hq})`;$("#art").style.backgroundImage=`url(${hq})`;
 $("#mt").textContent=v.t;$("#mc").textContent=v.c;sw($("#mt"));sw($("#mc"));upSave();setAo();setP(true);mk(v.id);
 if(A())A().play(v.t);document.querySelector(".mbody").scrollTop=0;fill()}
async function fill(){put($("#rel"),nl);if(nl.length<8&&cur){const id=cur.id;try{const j=await api("search",{part:"snippet",type:"video",q:cur.c+" "+cur.t.split(/[|(\-]/)[0],maxResults:15,regionCode:REGION});
 const l=await enrich(j.items.map(i=>normV(i,i.id.videoId)));if(!cur||cur.id!==id)return;const have=new Set(nl.map(x=>x.id).concat(id));nl=nl.concat(l.filter(x=>!have.has(x.id)));put($("#rel"),nl)}catch(e){}}}
function nxt(){const n=nl.shift();if(n)play(n);else toast("No more songs in the queue")}
function prv(){if(ytReady&&yt.getCurrentTime&&yt.getCurrentTime()>4){yt.seekTo(0,true);return}const p=hist.pop();if(p){if(cur)nl.unshift(cur);play(p,null,true)}}
function mini(on){exitFs();md.classList.toggle("min",on);document.body.classList.toggle("hasmini",on);document.body.style.overflow=on?"":"hidden"}
function stopAll(){exitFs();want=false;md.classList.remove("on","min");document.body.classList.remove("hasmini");document.body.style.overflow="";if(ytReady&&yt.stopVideo)yt.stopVideo();if(A())A().stop()}
function toggle(){if(!ytReady)return;if(yt.getPlayerState()===1){want=false;yt.pauseVideo()}else{want=true;yt.playVideo()}}
function enterFs(){stg.classList.add("fs");if(A()&&A().orient)A().orient(true)}
function exitFs(){if(!stg.classList.contains("fs"))return;stg.classList.remove("fs");if(A()&&A().orient)A().orient(false)}
$("#aMin").onclick=()=>mini(true);$("#bNext").onclick=nxt;$("#bPrev").onclick=prv;$("#pp").onclick=$("#mPP").onclick=$("#fsPP").onclick=toggle;$("#mX").onclick=stopAll;
$("#tFs").onclick=enterFs;$("#fsX").onclick=exitFs;
$("#tAo").onclick=()=>{ao=!ao;ls.set("sb_ao",ao);setAo();toast(ao?"Audio only: video hidden":"Video on")};
$("#tQ").onclick=()=>{const qs=[["Auto","default"],["144p","tiny"],["240p","small"],["360p","medium"],["480p","large"],["720p HD","hd720"],["1080p HD","hd1080"]];
 openSheet('<div class="c">Video quality</div>'+qs.map(q=>`<div class="row" data-q="${q[1]}"><span>${q[0]}</span></div>`).join("")+'<div class="c" style="margin-top:10px">YouTube may adjust the quality based on your network.</div>',e=>{const r=e.target.closest("[data-q]");if(r){if(ytReady&&yt.setPlaybackQuality)yt.setPlaybackQuality(r.dataset.q);toast("Quality set to "+r.textContent);closeSheet()}})};
$("#inf").onclick=e=>{if(md.classList.contains("min"))mini(false)};
$("#mc").onclick=e=>{if(md.classList.contains("min")||!cur||!cur.cid)return;e.stopPropagation();regC[cur.cid]=regC[cur.cid]||{id:cur.cid,t:cur.c,im:""};mini(true);openCh(cur.cid)};

// save / share
const isSaved=id=>saved.some(x=>x.id===id);
function upSave(){$("#aSave").textContent=isSaved(cur.id)?"♥ Saved":"♡ Save"}
function toggleSave(v){if(isSaved(v.id)){saved=saved.filter(x=>x.id!==v.id);toast("Removed from saved")}else{saved.unshift(v);toast("Saved")}ls.set("sb_saved",saved)}
$("#aSave").onclick=()=>{toggleSave(cur);upSave()};
$("#aPl").onclick=()=>sheet(cur,1);
$("#aSh").onclick=()=>share(cur);
async function share(v){const url="https://www.youtube.com/watch?v="+v.id,d={title:v.t,text:v.t+" - SB TUBE",url};
 try{if(navigator.share)await navigator.share(d);else{await navigator.clipboard.writeText(url);toast("Link copied")}}catch(e){}}

// bottom sheet
function openSheet(html,onclick){const s=$("#sh"),c=$("#shc");c.innerHTML=html;c.onclick=onclick;s.classList.add("on");s.onclick=e=>{if(e.target===s)closeSheet()}}
function closeSheet(){$("#sh").classList.remove("on")}
function sheet(v,onlyPl){
 const rows=Object.keys(pls).map(n=>`<div class="row" data-pl="${esc(n)}"><span>🎵 ${esc(n)}</span><span class="c">${pls[n].length}</span></div>`).join("");
 const add=n=>{pls[n]=pls[n]||[];if(!pls[n].some(x=>x.id===v.id))pls[n].push(v);ls.set("sb_pls",pls);toast("Added to "+n);closeSheet()};
 openSheet((onlyPl?"":`<div class="row" data-a="save"><span>${isSaved(v.id)?"♥ Remove from saved":"♡ Save"}</span></div><div class="row" data-a="share"><span>↗ Share</span></div>`)+`<div class="c" style="margin-top:12px">Add to playlist</div>${rows}<input type="text" id="nn" placeholder="New playlist name"><button class="btn" id="nb" style="width:100%">Create & add</button>`,
 e=>{const r=e.target.closest(".row");if(r&&r.dataset.a==="save"){toggleSave(v);if(cur)upSave();closeSheet()}else if(r&&r.dataset.a==="share"){closeSheet();share(v)}else if(r&&r.dataset.pl)add(r.dataset.pl);else if(e.target.id==="nb"){const n=$("#nn").value.trim();if(n)add(n)}})}

// library
function lib(){put($("#sv"),saved);if(!saved.length)$("#sv").innerHTML='<div class="msg">No saved videos yet. Use the ⋮ menu on any video to save it.</div>';
 const ks=Object.keys(pls);$("#pls").innerHTML=ks.length?ks.map(n=>`<div class="row" style="margin:0 14px" data-open="${esc(n)}"><span>🎵 ${esc(n)} <span class="c">(${pls[n].length})</span></span><span><button class="chip" data-del="${esc(n)}">Delete</button></span></div>`).join(""):'<div class="msg">No playlists yet. Tap + New to create one.</div>'}
$("#pls").onclick=e=>{const d=e.target.closest("[data-del]");if(d){delete pls[d.dataset.del];ls.set("sb_pls",pls);return lib()}
 const o=e.target.closest("[data-open]");if(o){const l=pls[o.dataset.open];if(l.length){l.forEach(v=>reg[v.id]=v);play(l[0],l.slice(1))}else toast("This playlist is empty")}};
$("#np").onclick=()=>openSheet('<div class="c">New playlist</div><input type="text" id="nn" placeholder="Playlist name"><button class="btn" id="nb" style="width:100%">Create</button>',e=>{if(e.target.id==="nb"){const n=$("#nn").value.trim();if(n){pls[n]=pls[n]||[];ls.set("sb_pls",pls);closeSheet();lib()}}});

// Android back button
window.sbBack=()=>{if($("#sh").classList.contains("on")){closeSheet();return true}if(stg.classList.contains("fs")){exitFs();return true}
 if(md.classList.contains("on")&&!md.classList.contains("min")){mini(true);return true}
 if(!$("#home").classList.contains("on")){go("home");return true}return false};
</script></body></html>
