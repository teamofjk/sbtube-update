<!DOCTYPE html>
<html lang="en-IN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<title>SB TUBE</title>
<style>
:root{--bg:#070b18;--card:#101733;--line:#1f2a52;--tx:#f4f6ff;--mu:#8e99c4;--sf:#ff8a1f;--gr:#19c25a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:78px}
header{position:sticky;top:0;z-index:5;background:rgba(7,11,24,.92);backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:40px;height:40px;border-radius:50%}
.brand b{font-size:22px;letter-spacing:.5px;background:linear-gradient(90deg,var(--sf) 0 38%,#fff 38% 62%,var(--gr) 62%);-webkit-background-clip:text;background-clip:text;color:transparent}
.search{display:flex;gap:8px;margin-top:10px}
.search input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:11px 16px;color:var(--tx);font-size:15px;outline:none}
.search input:focus{border-color:var(--sf)}
.btn{background:var(--sf);color:#1a1000;border:0;border-radius:24px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.hero{padding:26px 16px 8px}
.hero h1{font-size:30px;line-height:1.15;min-height:70px;font-weight:800}
.cur{display:inline-block;width:3px;height:.9em;background:var(--gr);margin-left:3px;vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.chip{flex:none;padding:8px 15px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--tx);font-size:13px;cursor:pointer}
h2{font-size:17px;padding:14px 16px 6px}
.grid{display:grid;gap:18px;padding:8px 14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.v{cursor:pointer}
.th{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--card)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.du{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);font-size:12px;padding:2px 6px;border-radius:6px}
.meta{display:flex;gap:10px;margin-top:8px;align-items:flex-start}
.meta div{flex:1;min-width:0}
.t{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c{color:var(--mu);font-size:12.5px;margin-top:2px}
.dots{background:none;border:0;color:var(--mu);font-size:22px;padding:0 6px;cursor:pointer}
.sk{aspect-ratio:16/9;border-radius:14px;background:linear-gradient(90deg,var(--card),#18214a,var(--card));background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.chs{display:flex;gap:14px;overflow-x:auto;padding:6px 16px;scrollbar-width:none}
.cc{flex:none;width:84px;text-align:center;font-size:12px;cursor:pointer}
.cc img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--line);display:block;margin:0 auto 6px;background:var(--card)}
.cc span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chh{display:flex;gap:14px;align-items:center;padding:16px}
.chh img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--card)}
.chh b{font-size:19px;display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(11,16,36,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:11px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button span{font-size:21px}
nav button.on{color:var(--sf)}
.pg{display:none}.pg.on{display:block}
.msg{padding:30px 20px;text-align:center;color:var(--mu)}
.help a{display:flex;align-items:center;gap:12px;margin:12px 16px;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--tx);text-decoration:none;font-weight:600}
.help a span{font-size:26px}
.help small{display:block;color:var(--mu);font-weight:400}
/* player */
.modal{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:hidden;transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.9,.2,1),top .45s cubic-bezier(.2,.9,.2,1),bottom .45s cubic-bezier(.2,.9,.2,1),left .45s,right .45s,border-radius .45s}
.modal.on{transform:none}
.amb{position:absolute;inset:-60px;background:center/cover;filter:blur(55px) saturate(1.7);opacity:.5;transform:scale(1.2)}
.mbody{position:relative;z-index:1;height:100%;overflow-y:auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
.top b{font-size:13px;color:var(--mu);font-weight:600}
.ib{background:rgba(255,255,255,.1);border:0;color:var(--tx);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;transition:transform .15s,background .2s}
.ib:active{transform:scale(.85);background:rgba(255,255,255,.22)}
.eq{display:flex;gap:3px;align-items:flex-end;height:18px;width:30px}
.eq i{flex:1;border-radius:2px;background:linear-gradient(var(--sf),var(--gr));height:100%;transform-origin:bottom;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.paused .eq i{animation-play-state:paused}
.stage{position:relative;margin:0 12px;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:16/9;box-shadow:0 18px 50px rgba(255,138,31,.28),0 0 0 1px rgba(255,255,255,.08)}
.pl{position:absolute;inset:0}
.pl iframe,#ytp{width:100%;height:100%;border:0;display:block}
.art{display:none;position:absolute;inset:0;background:center/cover}
.art::after{content:"🎧 Audio only";position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.65);padding:4px 10px;border-radius:12px;font-size:12px}
.ao .art{display:block}
.ao .pl{inset:auto;left:-9999px;top:0;width:320px;height:180px}
.fsb,.fsx{display:none}
.stage.fs{position:fixed;inset:0;margin:0;border-radius:0;aspect-ratio:auto;z-index:60;width:100%;height:100%}
.fs .fsb{display:flex;position:absolute;left:0;right:0;bottom:0;padding:26px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.8));gap:10px;align-items:center;z-index:2}
.fs .fsx{display:flex;position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:3;background:rgba(0,0,0,.5)}
.info{padding:16px 16px 6px}
.info h3{font-size:20px;line-height:1.25}
.info .c.ch{color:var(--sf);cursor:pointer;display:inline-block}
.sw{animation:sw .55s cubic-bezier(.2,.9,.2,1)}
@keyframes sw{from{opacity:0;transform:translateY(14px)}}
.seek{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;color:var(--mu)}
.seek input,.fsb input{flex:1;accent-color:var(--sf);height:22px}
.fsb span{font-size:12px;color:#fff}
.ctl{display:flex;justify-content:center;align-items:center;gap:22px;margin:12px 0 6px}
.ctl .ib{width:50px;height:50px;font-size:20px}
.ctl .pp,.fsb .pp{background:linear-gradient(135deg,var(--sf),#ffb35c);color:#1a1000}
.ctl .pp{width:72px;height:72px;font-size:28px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 8px 26px rgba(255,138,31,.4)}50%{box-shadow:0 8px 44px rgba(255,138,31,.85)}}
.paused .pp{animation:none}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.mctl{display:none}
.modal.min{top:calc(100% - 134px);bottom:64px;left:8px;right:8px;border-radius:16px;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.min .mbody{overflow:hidden}
.min .top,.min .seek,.min .ctl,.min .tools,.min h2,.min #rel,.min .info .c{display:none}
.min .stage{position:absolute;left:0;top:0;bottom:0;width:112px;margin:0;border-radius:0;aspect-ratio:auto;box-shadow:none}
.min .info{margin-left:112px;padding:14px 96px 10px 12px;cursor:pointer}
.min .info h3{font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.min .mctl{display:flex;position:absolute;right:6px;top:50%;transform:translateY(-50%)}
.min .mctl .ib{background:none;width:42px;height:42px}
body.hasmini{padding-bottom:170px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet>div{background:var(--card);width:100%;max-height:70%;overflow:auto;border-radius:20px 20px 0 0;padding:16px;animation:up .25s}
@keyframes up{from{transform:translateY(100%)}}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.sheet input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px;color:var(--tx);margin:10px 0}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:20px;font-weight:600;z-index:90;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
